# -----------------------------------------------------------------
# Planck 2018 best-fit LCDM cosmology
# Compatible with both CLASS and mlx_class
#
# Reference: Planck 2018 results. VI. (arXiv:1807.06209)
#            Table 2, TT,TE,EE+lowE+lensing column
#
# Usage with mlx_class:
#   python -m mlx_class planck_bestfit.ini
#
# Usage with CLASS:
#   ./class planck_bestfit.ini
#
# Author: Sheng-Kai Huang, 2026
# -----------------------------------------------------------------

# -- Background cosmology --
h = 0.6736
omega_b = 0.02237
omega_cdm = 0.12
T_cmb = 2.7255

# -- Primordial spectrum --
A_s = 2.1e-9
n_s = 0.9649

# -- Reionization --
tau_reio = 0.0544

# -- Radiation --
N_ur = 3.046

# -- Dark energy (cosmological constant) --
# w0_fld = -1.0
# wa_fld = 0.0

# -- Curvature (flat) --
# Omega_k = 0.0

# -- Tensors (none) --
# r = 0.0

# -- Output --
output = tCl,pCl,lCl,mPk
l_max_scalars = 2500

# -- CLASS-specific (ignored by mlx_class) --
lensing = yes
